<div class="fade-in-up">
  <app-page-header title="My Appointment History" subtitle="View and manage all your past and upcoming appointments">
    <div actions>
      <p-button label="Book New Appointment" icon="pi pi-calendar-plus" routerLink="/appointments/book" styleClass="p-button-primary"></p-button>
    </div>
  </app-page-header>

  <div class="flex flex-column md:flex-row align-items-center justify-content-between mb-4 gap-3">
    <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
      <div class="stat-badge flex align-items-center gap-2 px-3 py-2 border-round bg-surface border-1 border-surface text-main font-medium shadow-1">
        <i class="pi pi-calendar text-primary"></i>
        <span>Total: {{ appointments.length }}</span>
      </div>
      <div class="stat-badge flex align-items-center gap-2 px-3 py-2 border-round bg-surface border-1 border-surface text-main font-medium shadow-1">
        <i class="pi pi-clock text-amber-500"></i>
        <span>Pending: {{ getCount('PENDING') }}</span>
      </div>
      <div class="stat-badge flex align-items-center gap-2 px-3 py-2 border-round bg-surface border-1 border-surface text-main font-medium shadow-1">
        <i class="pi pi-check-circle text-emerald-500"></i>
        <span>Completed: {{ getCount('COMPLETED') }}</span>
      </div>
    </div>

    <div class="p-input-icon-left w-full md:w-20rem">
      <i class="pi pi-filter text-muted"></i>
      <p-select [options]="statusOptions" [(ngModel)]="selectedStatus" (onChange)="onStatusChange($event)" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
    </div>
  </div>

  <div *ngIf="loading" class="grid mb-4">
    <div class="col-12 md:col-6 lg:col-4">
      <app-skeleton-loader type="card" [count]="3"></app-skeleton-loader>
    </div>
  </div>

  <div *ngIf="!loading">
    <app-empty-state *ngIf="filteredAppointments.length === 0" message="No appointments found" description="You have no appointments matching the selected filter." icon="pi pi-folder-open"></app-empty-state>

    <div class="grid" *ngIf="filteredAppointments.length > 0">
      <div class="col-12 md:col-6 lg:col-4" *ngFor="let apt of filteredAppointments">
        <p-card styleClass="h-full border-round-xl hover-card">
          <ng-template pTemplate="content">
            <div class="flex justify-content-between align-items-start mb-3">
              <app-status-tag [status]="apt.status"></app-status-tag>
              <span class="text-xs text-muted font-medium bg-primary-light p-dark:bg-primary-900/20 px-2 py-1 border-round">
                #{{ apt.id }}
              </span>
            </div>

            <h3 class="text-xl font-bold m-0 mb-1 text-main font-outfit">Dr. {{ apt.doctorName }}</h3>
            <span class="text-sm text-primary font-medium mb-3 block">{{ apt.specialityName }}</span>

            <div class="flex align-items-center gap-2 text-muted mb-2 font-medium">
              <i class="pi pi-calendar-clock"></i>
              <span>{{ apt.appointmentDate | date:'fullDate' }}</span>
            </div>
            
            <div class="flex align-items-center gap-2 text-muted mb-3 font-medium">
              <i class="pi pi-clock"></i>
              <span>{{ apt.appointmentDate | date:'shortTime' }}</span>
            </div>

            <div class="surface-ground p-dark:bg-slate-800 p-3 border-round-lg mb-3">
              <span class="block text-xs text-muted font-bold uppercase mb-1">Reason for visit</span>
              <p class="m-0 text-sm text-main line-height-3">{{ apt.reason }}</p>
            </div>

            <div class="mt-auto pt-3 border-top-1 border-surface" *ngIf="apt.status === 'PENDING' || apt.status === 'ACCEPTED'">
              <p-button label="Cancel Appointment" icon="pi pi-times" styleClass="p-button-outlined p-button-danger w-full" (onClick)="cancelAppointment(apt.id)"></p-button>
            </div>
          </ng-template>
        </p-card>
      </div>
    </div>
  </div>
</div>
