<div class="fade-in-up">
  <app-page-header title="All Appointments" subtitle="System-wide overview of all scheduled medical visits"></app-page-header>

  <!-- Action Toolbar with Search & Status Filter -->
  <app-action-toolbar>
    <div filters class="flex flex-column sm:flex-row gap-3 w-full">
      <app-search-bar 
        placeholder="Search by ID, doctor, patient or speciality..." 
        [searchValue]="searchQuery" 
        (search)="onSearch($event)" 
        class="w-full md:w-24rem">
      </app-search-bar>
      
      <app-filter-bar 
        [options]="statusOptions" 
        optionLabel="label" 
        optionValue="value" 
        placeholder="Filter by Status" 
        [filterValue]="selectedStatus" 
        (filter)="onStatusFilter($event)" 
        class="w-full md:w-15rem">
      </app-filter-bar>
    </div>
  </app-action-toolbar>

  <div *ngIf="loading" class="mb-4">
    <app-skeleton-loader type="table" [count]="5"></app-skeleton-loader>
  </div>

  <div *ngIf="!loading">
    <p-card>
      <app-empty-state 
        *ngIf="filteredAppointments.length === 0" 
        message="No appointments found" 
        description="There are no appointments matching the selected filters." 
        icon="pi pi-calendar">
      </app-empty-state>

      <p-table *ngIf="filteredAppointments.length > 0" [value]="filteredAppointments" [paginator]="true" [rows]="10" responsiveLayout="scroll" styleClass="p-datatable-striped p-datatable-sm">
        <ng-template pTemplate="header">
          <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Speciality</th>
            <th>Date & Time</th>
            <th>Status</th>
            <th style="width: 120px;">Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-apt>
          <tr>
            <td class="font-medium text-muted">#{{ apt.id }}</td>
            <td class="font-semibold text-main">{{ apt.patientName }}</td>
            <td class="text-main">Dr. {{ apt.doctorName }}</td>
            <td class="text-muted">
              <span class="bg-primary-light p-dark:bg-primary-900/20 text-primary px-2 py-1 border-round text-xs font-semibold">
                {{ apt.specialityName }}
              </span>
            </td>
            <td class="text-muted">{{ apt.appointmentDate | date:'medium' }}</td>
            <td>
              <app-status-tag [status]="apt.status"></app-status-tag>
            </td>
            <td>
              <div class="flex gap-2">
                <p-button *ngIf="apt.status === 'PENDING' || apt.status === 'ACCEPTED'" 
                          icon="pi pi-times" 
                          styleClass="p-button-rounded p-button-text p-button-warning" 
                          (onClick)="cancelAppointment(apt.id)"
                          pTooltip="Cancel Appointment">
                </p-button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>
