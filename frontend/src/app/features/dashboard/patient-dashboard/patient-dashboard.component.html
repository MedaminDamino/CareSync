<div>
  <app-page-header title="Patient Dashboard" subtitle="Manage your appointments and healthcare journey">
    <div actions>
      <p-button label="Book Appointment" icon="pi pi-plus" routerLink="/appointments/book" styleClass="p-button-primary"></p-button>
    </div>
  </app-page-header>

  <app-loading-state *ngIf="loading"></app-loading-state>

  <div *ngIf="!loading" class="flex flex-column gap-4 fade-in-up">
    <!-- Stats Row -->
    <div class="grid">
      <!-- Total Stat Card -->
      <div class="col-12 md:col-4">
        <app-stat-card 
          title="Total Appointments" 
          [value]="totalBooked" 
          icon="pi pi-calendar" 
          colorClass="text-primary" 
          bgClass="bg-primary-light p-dark:bg-primary-900/20">
        </app-stat-card>
      </div>

      <!-- Pending Stat Card -->
      <div class="col-12 md:col-4">
        <app-stat-card 
          title="Pending Approval" 
          [value]="pendingCount" 
          icon="pi pi-clock" 
          colorClass="text-amber-500" 
          bgClass="bg-amber-50 p-dark:bg-amber-900/20">
        </app-stat-card>
      </div>

      <!-- Completed Stat Card -->
      <div class="col-12 md:col-4">
        <app-stat-card 
          title="Completed Visits" 
          [value]="completedCount" 
          icon="pi pi-check-circle" 
          colorClass="text-emerald-500" 
          bgClass="bg-emerald-50 p-dark:bg-emerald-900/20">
        </app-stat-card>
      </div>
    </div>

    <!-- Recent Appointments Table -->
    <p-card header="Recent Appointments">
      <app-empty-state *ngIf="appointments.length === 0" message="No appointments booked" description="You haven't booked any appointments yet. Click 'Book Appointment' to get started." icon="pi pi-calendar-plus">
        <div actions>
          <p-button label="Book Now" icon="pi pi-calendar" routerLink="/appointments/book" styleClass="p-button-outlined"></p-button>
        </div>
      </app-empty-state>

      <p-table *ngIf="appointments.length > 0" [value]="appointments" styleClass="p-datatable-sm p-datatable-striped">
        <ng-template pTemplate="header">
          <tr>
            <th>Doctor Name</th>
            <th>Speciality</th>
            <th>Date & Time</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-apt>
          <tr>
            <td class="font-medium text-main">Dr. {{ apt.doctorName }}</td>
            <td class="text-muted">{{ apt.specialityName }}</td>
            <td class="text-muted">{{ apt.appointmentDate | date:'medium' }}</td>
            <td>
              <app-status-tag [status]="apt.status"></app-status-tag>
            </td>
            <td>
              <p-button *ngIf="apt.status === 'PENDING' || apt.status === 'ACCEPTED'" 
                        icon="pi pi-times" 
                        label="Cancel" 
                        styleClass="p-button-danger p-button-text p-button-sm" 
                        (onClick)="cancelAppointment(apt.id)">
              </p-button>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <div class="flex justify-content-end mt-3" *ngIf="appointments.length > 0">
        <p-button label="View All History" icon="pi pi-arrow-right" iconPos="right" styleClass="p-button-text" routerLink="/appointments/my"></p-button>
      </div>
    </p-card>
  </div>
</div>
