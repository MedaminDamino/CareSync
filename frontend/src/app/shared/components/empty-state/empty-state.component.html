<div class="flex flex-column align-items-center justify-content-center p-5 text-center fade-in-up">
  <div class="flex align-items-center justify-content-center w-5rem h-5rem border-circle bg-surface mb-4">
    <i [ngClass]="icon" class="text-4xl text-muted"></i>
  </div>
  <h3 class="text-xl font-semibold m-0 text-main mb-2">{{ message }}</h3>
  <p class="text-muted m-0 max-w-20rem" *ngIf="description">{{ description }}</p>
  <div class="mt-4">
    <ng-content select="[actions]"></ng-content>
  </div>
</div>
