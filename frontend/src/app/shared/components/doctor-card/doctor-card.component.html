<div class="doctor-card" [class.blocked-card]="doctor.userStatus === 'BLOCKED'">
  <!-- Top Section: Status Badges and Rating -->
  <div class="card-header">
    <span class="availability-badge" [class.available-today]="doctor.availability === 'Available Today'">
      <i class="pi pi-clock badge-icon"></i>
      {{ doctor.availability }}
    </span>
    <div class="rating-display">
      <i class="pi pi-star-fill star-icon"></i>
      <span class="rating-value">{{ doctor.rating }}</span>
      <span class="rating-count">({{ doctor.reviewsCount }})</span>
    </div>
  </div>

  <!-- Middle Section: Avatar and Identification -->
  <div class="card-hero">
    <div class="avatar-wrapper">
      <img
        *ngIf="!imageError"
        [src]="getDoctorAvatar()"
        [alt]="doctor.name"
        class="doctor-img"
        (error)="onImageError()" />
      
      <!-- Premium Fallback SVG Vector -->
      <svg
        *ngIf="imageError"
        class="doctor-fallback-svg"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#2563EB"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="50" fill="url(#avatarBgGrad)"/>
        <path d="M50,22 C59.4,22 67,29.6 67,39 C67,48.4 59.4,56 50,56 C40.6,56 33,48.4 33,39 C33,29.6 40.6,22 50,22 Z M50,60 C68.2,60 83,72.1 83,87 L17,87 C17,72.1 31.8,60 50,60 Z" fill="#FFFFFF" opacity="0.95"/>
        <path d="M43,54 C43,54 44.5,59 50,59 C55.5,59 57,54 57,54" stroke="#DBEAFE" stroke-width="3" stroke-linecap="round" fill="none"/>
        <circle cx="50" cy="65" r="4" fill="#F8FAFC"/>
      </svg>

      <!-- Status dot overlay on avatar (Admins Only) -->
      <span *ngIf="isAdmin" class="status-dot"
        [class.active-dot]="!doctor.userStatus || doctor.userStatus === 'ACTIVE'"
        [class.blocked-dot]="doctor.userStatus === 'BLOCKED'">
      </span>
    </div>

    <h3 class="doctor-name">Dr. {{ cleanDoctorName(doctor.name) }}</h3>
    <span class="speciality-badge">
      {{ doctor.speciality?.name || 'General Practitioner' }}
    </span>
    <div class="mt-2">
      <span class="status-badge" [class.status-completed]="doctor.verified" [class.status-pending]="!doctor.verified">
        <i class="pi mr-1" [class.pi-verified]="doctor.verified" [class.pi-clock]="!doctor.verified"></i>
        {{ doctor.verified ? 'Accepted' : 'Not Accepted' }}
      </span>
    </div>
  </div>

  <!-- Info Section: Experience, Email, Phone -->
  <div class="card-details">
    <div class="detail-row">
      <i class="pi pi-briefcase detail-icon"></i>
      <span class="detail-text">{{ doctor.experience }} Experience</span>
    </div>
    <div class="detail-row">
      <i class="pi pi-envelope detail-icon"></i>
      <span class="detail-text text-ellipsis" [pTooltip]="doctor.email" tooltipPosition="top">
        {{ doctor.email }}
      </span>
    </div>
    <div class="detail-row">
      <i class="pi pi-phone detail-icon"></i>
      <span class="detail-text">{{ doctor.phone }}</span>
    </div>
  </div>

  <!-- Bottom Section: Action Buttons -->
  <div class="card-actions">
    <!-- Patient Button -->
    <p-button
      *ngIf="isPatient"
      label="Book Appointment"
      icon="pi pi-calendar-plus"
      styleClass="p-button-outlined p-button-primary book-btn"
      (onClick)="book.emit(doctor)">
    </p-button>
 
     <!-- Admin Buttons -->
     <div *ngIf="isAdmin" class="admin-action-row">
       <p-button
         *ngIf="!doctor.verified"
         icon="pi pi-check-circle"
         styleClass="p-button-rounded p-button-text p-button-success action-icon-btn"
         (onClick)="verify.emit(doctor)"
         pTooltip="Accept Doctor"
         tooltipPosition="top">
       </p-button>
       <p-button
         icon="pi pi-eye"
         styleClass="p-button-rounded p-button-text p-button-info action-icon-btn"
         (onClick)="view.emit(doctor)"
         pTooltip="View Profile"
         tooltipPosition="top">
       </p-button>
      <p-button
        *ngIf="!doctor.userStatus || doctor.userStatus === 'ACTIVE'"
        icon="pi pi-ban"
        styleClass="p-button-rounded p-button-text p-button-warning action-icon-btn"
        (onClick)="block.emit(doctor)"
        pTooltip="Block Doctor"
        tooltipPosition="top">
      </p-button>
      <p-button
        *ngIf="doctor.userStatus === 'BLOCKED' || doctor.userStatus === 'SUSPENDED'"
        icon="pi pi-check-circle"
        styleClass="p-button-rounded p-button-text p-button-success action-icon-btn"
        (onClick)="unblock.emit(doctor)"
        pTooltip="Unblock Doctor"
        tooltipPosition="top">
      </p-button>
      <p-button
        icon="pi pi-pencil"
        styleClass="p-button-rounded p-button-text p-button-secondary action-icon-btn"
        (onClick)="edit.emit(doctor)"
        pTooltip="Edit Profile"
        tooltipPosition="top">
      </p-button>
    </div>
  </div>
</div>
