# Server Config
server.port=8081

# Database Settings (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable SQL script initialization (optional, we can use a CommandLineRunner to seed data for robustness)
spring.sql.init.mode=never

# JWT Config (256-bit key for HMAC-SHA256)
hospital.jwt.secret=9a67471ec97cf3c2578501e40049285072054ff8e75cf02476b71329a1b6623e164923f6e80b27e6a57c50a1df27041a79f3238a202dfb8e75e921d7b1a29d5b
hospital.jwt.expirationMs=86400000

# Swagger UI configurations
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
