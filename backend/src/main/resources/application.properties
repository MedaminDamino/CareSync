# Server Config
server.port=8081

# Database Settings (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable SQL script initialization
spring.sql.init.mode=never

# JWT Config (256-bit key for HMAC-SHA256)
hospital.jwt.secret=${JWT_SECRET:9a67471ec97cf3c2578501e40049285072054ff8e75cf02476b71329a1b6623e164923f6e80b27e6a57c50a1df27041a79f3238a202dfb8e75e921d7b1a29d5b}
hospital.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS Config (Add your Firebase Hosting URL here or pass it via CORS_ALLOWED_ORIGINS environment variable)
hospital.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://192.168.1.11:4200,https://caresync-49875.web.app,https://caresync-49875.firebaseapp.com}

# Swagger UI configurations
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
